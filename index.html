<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Spelling Cards</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f9ff;
      color: #183153;
    }

    .home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 56px;
      margin: 0 0 10px;
      text-align: center;
    }

    .subtitle {
      font-size: 22px;
      margin-bottom: 35px;
      text-align: center;
    }

    .menu {
      width: 100%;
      max-width: 550px;
      display: grid;
      gap: 18px;
    }

    button {
      min-height: 75px;
      border: none;
      border-radius: 18px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      padding: 15px 25px;
    }

    .play {
      background: #61c978;
    }

    .create {
      background: #ffd65a;
    }

    .results {
      background: #c7a7ed;
    }

    .help {
      background: #78c7f2;
    }

    button:hover {
      filter: brightness(0.96);
    }

    .note {
      margin-top: 35px;
      font-size: 18px;
      text-align: center;
    }
  </style>
</head>

<body>

  <main class="home">

    <h1>🔤 SPELLING CARDS</h1>

    <div class="subtitle">
      Build words one sound at a time
    </div>

    <div class="menu">

      <button class="play">
        ▶ Play a Game
      </button>

      <button class="create">
        ✏️ Create / Edit
      </button>

      <button class="results">
        📊 Results
      </button>

      <button class="help">
        📖 How to Setup &amp; Play
      </button>

    </div>

    <div class="note">
      Small steps. Big spelling success!
    </div>

  </main>

</body>
</html>
